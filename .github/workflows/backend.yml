name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: shellcheck
        run: |
          # ubuntu-latest runners ship shellcheck preinstalled.
          shellcheck -x src/builder/scripts/*.sh ../tests/verify-clang-wrapper.sh ../scripts/run-matrix.sh
